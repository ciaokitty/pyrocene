<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../../"><title>Vigilance strip previews - Pyrocene</title><link rel="stylesheet" href="explore.css"><link rel="stylesheet" href="expedition.css"><link rel="stylesheet" href="labs/ledger-preview/style.css"><script src="vendor/three.min.js"></script><script type="module" src="labs/ledger-preview/app.mjs"></script></head>
<body>
<header><a class="wordmark" href="expedition.html">PYROCENE</a><span class="chapter">STAGE 4 / THE AMAZON</span><nav><label for="preview-stage">Stage</label><select id="preview-stage"><option>Cooperation</option><option>Negligence</option><option selected>Vigilance</option></select></nav></header>
<main id="landscape" aria-label="Forest preview"><div id="loading" role="status"><p>Opening the forest</p></div><div class="view-controls" role="group" aria-label="Forest views"><button data-view="forest" class="active">Forest</button><button data-view="overhead">Overhead</button><button data-view="close">Close view</button></div></main>
<section id="ledger" aria-label="Plots needing care"><div class="ledger-title">LEDGER <span id="ledger-count"></span></div><div id="ledger-blocks"></div></section>
<section id="preview-tools"><span class="preview-label">DESIGN PREVIEW</span><div class="variants" role="group" aria-label="Ledger style"><button data-style="chain">A - Chain</button><button data-style="fill">B - Canopy fill</button><button data-style="rail">C - Rail</button></div><p id="stage-note">Plots need care until the canopy closes.</p><label class="plant-picker">Plants in <span id="patch-name"></span><select id="species-picker" aria-label="Plants in this patch"><option value="">Choose a plant</option></select></label><details><summary>Try ledger changes</summary><p>Sample states only. No time or game rules change.</p><div class="demo-actions"><button id="demo-add">Work another plot</button><button id="demo-close">Canopy closes</button><button id="demo-fail">Reinvaded</button><button id="demo-reset">Reset preview</button></div></details><p id="demo-status" role="status"></p></section>
<aside id="plant-guide" role="dialog" aria-label="Field guide" hidden><div class="guide-heading"><span>Field record</span><button id="record-close">Back</button></div><div id="guide-content"></div></aside>
</body></html>
