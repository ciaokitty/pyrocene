<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pyrocene fire lab</title>
<style>
  :root { --bg:#0b0e14; --ink:#e6eaf0; --dim:#8a93a3; --line:#222a36; }
  html, body { margin:0; background:var(--bg); color:var(--ink); font: 14px/1.45 Inter, "Helvetica Neue", Arial, sans-serif; }
  #wrap { padding: 18px 28px 40px; max-width:1700px; margin:0 auto; }
  h1 { font-size:18px; letter-spacing:.08em; margin:0 0 4px; font-weight:800; }
  .sub { color:var(--dim); margin-bottom:12px; }
  #bar { display:flex; gap:14px; align-items:center; margin:8px 0 16px; flex-wrap:wrap; }
  button { font:inherit; font-size:12px; font-weight:600; letter-spacing:.06em; color:var(--ink); background:#161c27; border:1px solid #2d3745; border-radius:6px; padding:6px 12px; cursor:pointer; }
  input[type=range] { width:420px; }
  .mono { font-family:"DejaVu Sans Mono", Menlo, monospace; }
  #grid { display:grid; grid-template-columns: repeat(3, 1fr); gap:14px; }
  .panel { background:#0f141d; border:1px solid var(--line); border-radius:8px; padding:10px 12px 12px; }
  .panel h3 { margin:0 0 2px; font-size:13px; font-weight:700; letter-spacing:.04em; }
  .panel .k { color:var(--dim); font-size:11.5px; min-height:1.4em; }
  .panel canvas, .panel .svg { width:100%; aspect-ratio: 22/12; display:block; border-radius:4px; background:#0a0d12; margin-top:6px; overflow:hidden; }
  .panel .svg svg { width:100%; height:100%; display:block; }
  .panel .n { margin-top:8px; display:flex; justify-content:space-between; font-size:12px; min-height:1.6em; }
  .panel .n b { font-size:18px; font-weight:800; }
  .row-title { grid-column: 1 / -1; color:var(--ink); font-size:12px; letter-spacing:.14em; margin-top:8px; }
  .row-title span { color:var(--dim); letter-spacing:0; margin-left:10px; }
  #legend { display:flex; gap:26px; align-items:center; flex-wrap:wrap; margin-top:18px; color:var(--dim); font-size:12px; }
  #spectrum { display:flex; align-items:center; gap:8px; }
  #spectrum i { display:block; width:200px; height:12px; border-radius:3px; background:linear-gradient(90deg, #a08a5a 0 16%, #2f5a35 16% 34%, #8aa04a 34% 56%, #b4b84c 56% 78%, #d6c23a 78%); }
  #legend .sw i { display:inline-block; width:12px; height:12px; border-radius:2px; vertical-align:-2px; margin-right:6px; }
  #legend .trench i { display:inline-block; width:26px; height:10px; vertical-align:-1px; margin-right:6px; background:#efe6d2; border-radius:5px; background-image: repeating-linear-gradient(90deg, #1f5f88 0 5px, transparent 5px 9px); background-size:100% 3px; background-repeat:no-repeat; background-position:0 3.5px; }
  #note { margin-top:14px; color:var(--dim); font-size:12.5px; }
  #pick { font:inherit; font-size:12px; color:var(--ink); background:#161c27; border:1px solid #2d3745; border-radius:6px; padding:4px 8px; margin-left:14px; vertical-align:middle; }
  #facts { display:flex; flex-wrap:wrap; gap:6px 28px; margin:-2px 0 12px; font-size:13px; }
  #facts b { color:var(--dim); font-weight:600; margin-right:6px; }
  #facts a { color:#6f8cc0; margin-right:10px; font-size:12px; }
</style>
<div id="wrap">
  <h1>PYROCENE FIRE LAB <select id="pick"></select></h1>
  <div class="sub" id="sub">Loading…</div>
  <div id="facts"></div>
  <div id="bar">
    <button id="play">Play</button>
    <input id="t" type="range" min="0" max="1800" step="5" value="0">
    <span class="mono" id="tlabel">0:00</span>
    <span style="color:var(--dim)">after ignition</span>
  </div>
  <div id="grid"></div>
  <div id="legend">
    <div id="spectrum"><span>bare</span><i></i><span>thick lantana</span></div>
    <span class="sw"><i style="background:#ff9a3c"></i>burning</span>
    <span class="sw"><i style="background:#141010"></i>burned</span>
    <span class="trench"><i></i>fire line</span>
    <span class="sw"><i style="border:1.5px solid #fff; border-radius:50%"></i>ignition</span>
  </div>
  <div id="note"></div>
</div>
<script>
(async function () {
  const q = new URLSearchParams(location.search);
  const name = q.get("run") || "sample";
  const R = await (await fetch(`results/${name}.json`, { cache: "no-store" })).json();
  const B = R.board, M = R.meta, cols = B.cols, rows = B.rows;
  const T = M.minutes * 60;
  document.getElementById("t").max = T;
  const FUEL_COL = ["#1b2a33", "#2f5a35", "#8aa04a", "#b4b84c", "#d6c23a", "#a08a5a"];
  const windWord = { 0: "north", 45: "north-east", 90: "east", 135: "south-east", 180: "south", 225: "south-west", 270: "west", 315: "north-west" }[M.wind.from_deg] || (M.wind.from_deg + "°");
  const mins = M.minutes >= 90 ? `${Math.round(M.minutes / 60 * 10) / 10} h` : `${M.minutes} min`;
  const windTxt = (R.wind_reported ? `${R.wind_reported} reported, ${M.wind.speed} m/s modelled` : `${M.wind.speed} m/s`) + `, from the ${windWord}`;
  document.getElementById("sub").hidden = true;
  const facts = R.case ? [["Place", R.case.place], ["Date", R.case.date], ["Fuel", R.case.fuel]] : [["Game", `sample, night ${B.night}`]];
  facts.push(["Square", `${M.cell_m} m`], ["Wind", windTxt], ["Duration", mins]);
  document.getElementById("facts").innerHTML = facts.map(([k, v]) => `<span><b>${k}</b>${v}</span>`).join("") +
    (R.case ? `<span>${R.case.sources.map(u => `<a href="${u}" target="_blank" rel="noopener">${new URL(u).hostname.replace("www.", "")}</a>`).join("")}</span>` : "");
  try {
    const idx = await (await fetch("results/index.json", { cache: "no-store" })).json();
    const pick = document.getElementById("pick");
    for (const run of idx.runs) { const o = document.createElement("option"); o.value = run.name; o.textContent = run.title; if (run.name === name) o.selected = true; pick.appendChild(o); }
    pick.onchange = () => { location.search = "?run=" + pick.value; };
  } catch (e) {}

  const grid = document.getElementById("grid");
  const panels = [];
  function addRow(title, sub) { const d = document.createElement("div"); d.className = "row-title"; d.innerHTML = title + (sub ? `<span>${sub}</span>` : ""); grid.appendChild(d); }
  function addMap(sc, label) {
    const p = document.createElement("div"); p.className = "panel";
    p.innerHTML = `<h3>${label}</h3><div class="svg">${sc.svg}</div><div class="n"></div>`;
    grid.appendChild(p);
  }
  function addPanel(sname, model, label) {
    const p = document.createElement("div"); p.className = "panel";
    p.innerHTML = `<h3>${label}</h3><canvas width="880" height="480"></canvas><div class="n"><span>squares burned <b class="b">0</b></span><span class="mono pct"></span></div>`;
    grid.appendChild(p);
    panels.push({ sname, model, canvas: p.querySelector("canvas"), b: p.querySelector(".b"), pct: p.querySelector(".pct") });
  }
  const sc0 = R.scenarios.as_played, sc1 = R.scenarios.proposal;
  const FF = "ForeFire 2.5", C2 = "Cell2Fire";
  addRow("WHAT HAPPENED", R.case ? "" : `the game's fire took ${B.burned.length} squares`);
  addMap(sc0, R.case ? "The land" : "The game");
  if (sc0.models.forefire) addPanel("as_played", "forefire", FF);
  if (sc0.models.cell2fire) addPanel("as_played", "cell2fire", C2);
  const sq = n => `${n} square${n === 1 ? "" : "s"}`;
  addRow("MANAGEMENT PLAN", R.proposal.text || `${sq(R.proposal.cleared.length)} cut where the band is thinnest, then a fire line of ${sq(R.proposal.line.length)} to hold it`);
  addMap(sc1, "The plan");
  if (sc1.models.forefire) addPanel("proposal", "forefire", FF);
  if (sc1.models.cell2fire) addPanel("proposal", "cell2fire", C2);

  for (const sc of [sc0, sc1]) {
    sc.fuelArr = Int8Array.from(sc.fuel);
    for (const m of Object.values(sc.models)) m.arr = Int32Array.from(m.arrival);
    const c = document.createElement("canvas"); c.width = sc.nx; c.height = sc.ny; const x = c.getContext("2d");
    const img = x.createImageData(sc.nx, sc.ny);
    const sub = sc.nx / cols;
    for (let i = 0; i < sc.nx * sc.ny; i++) { const col = FUEL_COL[sc.fuelArr[i]]; img.data[i * 4] = parseInt(col.slice(1, 3), 16); img.data[i * 4 + 1] = parseInt(col.slice(3, 5), 16); img.data[i * 4 + 2] = parseInt(col.slice(5, 7), 16); img.data[i * 4 + 3] = 255; }
    for (const cell of B.cells) if (cell.cover === 3 || cell.cover === 4) for (let yy = 0; yy < sub; yy++) for (let xx = 0; xx < sub; xx++) { const i = (cell.r * sub + yy) * sc.nx + cell.c * sub + xx; img.data[i * 4] = cell.cover === 3 ? 60 : 200; img.data[i * 4 + 1] = cell.cover === 3 ? 110 : 190; img.data[i * 4 + 2] = cell.cover === 3 ? 150 : 170; }
    x.putImageData(img, 0, 0); sc.fuelCanvas = c;
    sc.lineCells = B.cells.filter(c => c.fireline).map(c => c.i).concat(sc.line || []);
  }

  function squaresBurned(sc, arr, t) {
    const sub = sc.nx / cols; let n = 0;
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      let k = 0; for (let yy = 0; yy < sub; yy++) for (let xx = 0; xx < sub; xx++) { const a = arr[(r * sub + yy) * sc.nx + c * sub + xx]; if (a >= 0 && a <= t) k++; }
      if (k >= sub * sub * 0.33) n++;
    }
    return n;
  }
  // the trench the way the game draws it: a pale band of turned earth with blue dashes
  function drawLine(ctx, cells, cw, ch) {
    if (!cells.length) return;
    const cs = new Set(cells), pts = i => [(i % cols + 0.5) * cw, (Math.floor(i / cols) + 0.5) * ch];
    const segs = [];
    for (const i of cs) { const r = Math.floor(i / cols), c = i % cols;
      for (const [dr, dc] of [[0, 1], [1, 0], [1, 1], [1, -1]]) { const rr = r + dr, cc = c + dc; if (rr >= rows || cc < 0 || cc >= cols || !cs.has(rr * cols + cc)) continue;
        if (dr === 1 && dc !== 0 && (cs.has(r * cols + cc) || cs.has(rr * cols + c))) continue; segs.push([pts(i), pts(rr * cols + cc)]); } }
    ctx.save(); ctx.lineCap = "round"; ctx.lineJoin = "round";
    for (const [col, w, dash] of [["#efe6d2", cw * 0.62, []], ["#1f5f88", cw * 0.09, [cw * 0.28, cw * 0.2]]]) {
      ctx.strokeStyle = col; ctx.lineWidth = w; ctx.setLineDash(dash);
      for (const [a, b] of segs) { ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); }
      for (const i of cs) { const [x, y] = pts(i); ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 0.01, y); ctx.stroke(); }
    }
    ctx.restore();
  }
  function draw(t) {
    for (const p of panels) {
      const sc = R.scenarios[p.sname], ctx = p.canvas.getContext("2d"), W = p.canvas.width, H = p.canvas.height;
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(sc.fuelCanvas, 0, 0, W, H);
      const sx = W / sc.nx, sy = H / sc.ny, cw = W / cols, ch = H / rows;
      const arr = sc.models[p.model].arr;
      const img = ctx.getImageData(0, 0, W, H); const d = img.data;
      for (let y = 0; y < H; y++) { const iy = Math.floor(y / sy); for (let x = 0; x < W; x++) { const pi = iy * sc.nx + Math.floor(x / sx); const a = arr[pi]; if (a < 0 || a > t || sc.fuelArr[pi] === 0) continue; const age = t - a; const o = (y * W + x) * 4;
        if (age < 90) { const k = age / 90; d[o] = 255; d[o + 1] = 170 - 110 * k; d[o + 2] = 40 - 30 * k; } else { d[o] = 20; d[o + 1] = 16; d[o + 2] = 14; } } }
      ctx.putImageData(img, 0, 0);
      const burned = squaresBurned(sc, arr, t);
      if (p.model === "forefire" && sc.models.forefire.fronts) {
        const fr = sc.models.forefire.fronts.filter(f => f.t <= t).slice(-1)[0];
        if (fr) { ctx.strokeStyle = "rgba(255,230,160,0.95)"; ctx.lineWidth = 2; for (const poly of fr.polys) { ctx.beginPath(); poly.forEach(([x, y], k) => k ? ctx.lineTo(x / M.res_m * sx, y / M.res_m * sy) : ctx.moveTo(x / M.res_m * sx, y / M.res_m * sy)); ctx.closePath(); ctx.stroke(); } }
      }
      drawLine(ctx, sc.lineCells, cw, ch);
      const ign = sc.ignition == null ? B.ignition : sc.ignition, ir = Math.floor(ign / cols), ic = ign % cols;
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc((ic + 0.5) * cw, (ir + 0.5) * ch, 7, 0, 6.3); ctx.stroke();
      p.b.textContent = burned;
    }
    document.getElementById("tlabel").textContent = `${Math.floor(t / 60)}:${String(t % 60).padStart(2, "0")}`;
  }
  const slider = document.getElementById("t");
  let playing = false, last = 0;
  function loop(now) { requestAnimationFrame(loop); if (!playing) return; const dt = (now - last) / 1000; last = now; let t = +slider.value + dt * 30; if (t >= T) { t = T; playing = false; document.getElementById("play").textContent = "Replay"; } slider.value = Math.round(t); draw(+slider.value); }
  requestAnimationFrame(now => { last = now; loop(now); });
  document.getElementById("play").onclick = e => { if (+slider.value >= T) slider.value = 0; playing = !playing; last = performance.now(); e.target.textContent = playing ? "Pause" : "Play"; };
  slider.oninput = () => { playing = false; document.getElementById("play").textContent = "Play"; draw(+slider.value); };
  document.getElementById("note").textContent = "Rate of spread: Rothermel. Not a prediction for a real place.";
  draw(0);
})();
</script>
